<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rapport AGRESOL</title>
<style id="rstyle">
@page{size:A4;margin:21mm 20mm 19mm 20mm;
  @top-left{content:element(hdr);vertical-align:top;padding:0;width:100%}
  @top-center{content:none}@top-right{content:none}
  @bottom-left{content:"";font:7pt "DejaVu Sans",Verdana,Arial,sans-serif;color:#1c2b45;border-top:.5pt solid #bbb;vertical-align:top;padding-top:2.2mm}
  @bottom-right{content:"Page " counter(page);font:7pt "DejaVu Sans",Verdana,Arial,sans-serif;color:#1c2b45;border-top:.5pt solid #bbb;vertical-align:top;padding-top:2.2mm}}
@page cover{margin:0 0 14mm 0;@top-left{content:none}@bottom-left{content:none;border:0}@bottom-right{content:none;border:0}}
:root{--navy:#1c2b45;--green:#2e9e5b;--teal:#01696f;--lgreen:#6aab3e;--pale:#eef5e6;--alt:#f7f6f2;--goldbg:#fbefd2;--gold:#c98b00;--grid:#bbbbbb;--red:#a63d4a;--redbg:#f8e0dc;--okbg:#e6f2ea;--ink:#1a237e}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
html,body{margin:0}
body{font-family:"DejaVu Sans",Verdana,"Segoe UI",Arial,sans-serif;font-size:9pt;line-height:1.38;color:#111;background:#e9ebee}
.pagedjs_pages{padding:12mm 0}
.pagedjs_page{background:#fff;margin:0 auto 8mm;box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media print{body{background:#fff}.pagedjs_pages{padding:0}.pagedjs_page{margin:0;box-shadow:none}.bar{display:none!important}}
.hdr{position:running(hdr);display:block;margin:0 -20mm;width:210mm;height:12.5mm;padding:4.6mm 20mm 0;position:relative;box-sizing:border-box;background:var(--navy);color:#fff;border-bottom:2.2pt solid var(--green);font-size:7.3pt;line-height:1;white-space:nowrap}
.hdr b{font-size:11pt;letter-spacing:.02em;margin-right:5mm;vertical-align:-.4mm}.hdr .r{position:absolute;right:20mm;top:4.8mm}
/* couverture */
.cover{page:cover}
.cband{background:var(--navy);color:#fff;padding:22mm 24mm 7mm;border-bottom:5pt solid var(--green);min-height:83mm}
.cband .g{font-size:29pt;font-weight:700;line-height:1}.cband .tag{font-size:9.3pt;margin:2.4mm 0 7mm}
.cband .t{font-size:15.5pt;font-weight:700;line-height:1.3;margin-bottom:2.5mm}.cband .s{font-size:10.2pt;line-height:1.75}
.cbody{padding:5mm 23mm 0}
.cref{text-align:center;color:var(--ink);font-size:9.4pt;margin:0 0 3.5mm}
table.cov{width:100%;border-collapse:collapse;font-size:8.1pt;line-height:1.26}
table.cov th{background:var(--lgreen);color:#fff;text-align:left;padding:1mm 1.6mm}
table.cov td{border:.4pt solid #cfd8c8;padding:.8mm 1.6mm;vertical-align:middle}table.cov td:first-child{width:39mm}
table.cov tr:nth-child(even) td{background:var(--pale)}table.cov th{border:.4pt solid #cfd8c8}
.rbox{background:var(--pale);border:.9pt solid var(--navy);border-radius:6pt;padding:3mm 3.5mm;margin:3mm 0;text-align:justify;font-size:8.6pt}
table.vis{width:100%;border-collapse:collapse;font-size:8.3pt}table.vis th{color:var(--navy);text-align:left;font-size:8.6pt;padding:0 1.5mm 1mm}table.vis td{vertical-align:top;padding:0 1.5mm}
.sig{border:.5pt solid #999;height:17mm;width:27mm;position:relative;font-size:7pt;padding:.5mm 1mm}.sig span{position:absolute;bottom:.6mm;left:0;right:0;text-align:center;font-size:6.5pt;color:#999}
.cnote{color:var(--ink);font-size:7.2pt;margin-top:2mm}
/* corps */
h1{font-size:14.5pt;line-height:1.25;color:var(--navy);margin:1mm 0 3mm;break-after:avoid;string-set:none}
h1.chap{break-before:page}
h2{font-size:11pt;color:var(--teal);margin:4mm 0 2mm;break-after:avoid}
h3{font-size:9.4pt;color:var(--navy);margin:2.5mm 0 1.2mm;break-after:avoid}
p{margin:0 0 1.8mm;text-align:justify}
ul.b{margin:0 0 2mm;padding-left:5mm}ul.b li{margin:0 0 1.2mm;text-align:justify}
table.t{width:100%;border-collapse:collapse;font-size:7.6pt;line-height:1.26;margin:1mm 0 3mm}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:.9mm 1.4mm;border:.4pt solid var(--grid);font-weight:700}
table.t td{border:.4pt solid var(--grid);padding:.9mm 1.4mm;vertical-align:middle}
table.t tr:nth-child(even) td{background:var(--alt)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t thead{display:table-header-group}table.t.keep{break-inside:avoid}table.t th.n{white-space:normal}table.t.w{font-size:6.6pt}table.t.w td,table.t.w th{padding:.7mm .8mm}table.t tr{break-inside:avoid}
td.c0{background:var(--okbg)!important}td.c1{background:var(--goldbg)!important}td.c2,td.c3{background:var(--redbg)!important}
.box{background:var(--goldbg);border:.8pt solid var(--gold);padding:2.2mm 3mm;margin:2mm 0 3mm;break-inside:avoid}
.box.pale{background:var(--pale);border-color:var(--navy)}
.box p:last-child{margin:0}
figure{margin:2mm 0 3mm;break-inside:avoid;text-align:center}figure svg{width:100%;height:auto;max-height:118mm}
figcaption{font-style:italic;font-size:7.8pt;color:var(--ink);margin-top:1mm}
.fig2{display:flex;gap:4mm}.fig2>div{flex:1}
.small{font-size:7.6pt;line-height:1.3}.muted{color:#666}
sup.r{color:var(--teal);font-size:6.5pt}
/* sommaire */
.toc{list-style:none;margin:0;padding:0}
.toc li a{display:flex;align-items:baseline;color:inherit;text-decoration:none}
.toc li a .d{flex:1;border-bottom:1pt dotted #999;margin:0 1.5mm;transform:translateY(-1mm)}
.toc li a::after{content:target-counter(attr(href),page)}
.toc li.l1{font-weight:700;color:var(--navy);font-size:8.6pt;margin-top:2.2mm}
.toc li.l2{font-size:8pt;padding-left:5mm;margin-top:.6mm}
.toc li.la{font-weight:700;color:var(--navy);font-size:8.6pt;margin-top:1.6mm}
a{color:var(--teal)}
.bar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:8px;align-items:center;padding:8px 14px;background:#1c2b45;color:#fff;font:13px "Segoe UI",Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bar button{border:1px solid #2e9e5b;background:#2e9e5b;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}.bar button.g{background:transparent;border-color:rgba(255,255,255,.4)}
.bar span{margin-right:auto}
#wait{padding:80px 20px;text-align:center;font:15px "Segoe UI",Arial,sans-serif;color:#1c2b45}
</style>
</head>
<body>
<div class="bar"><span id="bt">Rapport AGRESOL – mise en page…</span><button id="bJson" class="g">Enregistrer l'étude (JSON)</button><button id="bHtml" class="g">Enregistrer le rapport (HTML)</button><button id="bPdf">Imprimer / PDF</button></div>
<div id="wait">Préparation du rapport…</div>
<script src="engine.js"></script>
<script src="acidgraph.js"></script>
<script src="oxgraph.js"></script>
<script src="rapport.js"></script>
<script src="vendor/paged.polyfill.min.js"></script>
</body>
</html>
